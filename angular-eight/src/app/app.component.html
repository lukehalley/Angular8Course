<app-header (menuItemSelected)="onNavigate($event)"></app-header>

<br />

<div class="container-fluid">
  <div class="row">
    <div *ngIf="pageToNav === 'recipe'" class="col-sm">
      <p class="h3">Your Recipes.</p>
      <hr />
      <app-recipe></app-recipe>
    </div>
    <div *ngIf="pageToNav === 'shopping'" class="col-sm">
      <p class="h3">Your Shopping List.</p>
      <hr />
      <app-shopping-list></app-shopping-list>
    </div>
  </div>
</div>
