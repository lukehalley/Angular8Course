<h5>Add An Ingredient To Your Shopping List.</h5>

<form>
  <div class="form-group">
    <label for="ingredientNameLabel">Name</label>
    <input
      type="email"
      class="form-control"
      id="ingredientName"
      aria-describedby="ingredientHelp"
      placeholder="Enter ingredient name"
      #nameInput
    />
  </div>
  <div class="form-group">
    <label for="ingredientAmountLabel">Amount</label>
    <input
      type="number"
      class="form-control"
      id="ingredientAmount"
      placeholder="Enter amount"
      #amountInput
    />
  </div>
  <button type="submit" class="btn btn-primary" (click)="onAddIngredient()">
    Add
  </button>
</form>
