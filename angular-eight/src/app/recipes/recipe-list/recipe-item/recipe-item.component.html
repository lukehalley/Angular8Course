<a
  (click)="onRecipeItemSelect($event)"
  href="#"
  class="list-group-item list-group-item-action"
>
  <div class="d-flex w-100 justify-content-between">
    <h4 class="mb-1">{{ recipe.name }}</h4>
    <small>3 days ago</small>
  </div>
  <div class="d-flex w-100 justify-content-between">
    <p class="mb-1">
      {{ recipe.description }}
    </p>
  </div>
</a>

<hr />
