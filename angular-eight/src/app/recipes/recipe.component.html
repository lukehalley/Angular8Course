<div class="row">
  <div class="col-md-6">
    <app-recipe-list
      (recipeRecieved)="showRecipeDetails($event)"
    ></app-recipe-list>
  </div>

  <div class="col-md-6">
    <app-recipe-detail
      *ngIf="selectedRecipe; else selectPrompt"
      [recipe]="selectedRecipe"
    ></app-recipe-detail>
  </div>
  <ng-template #selectPrompt>
    <div class="alert alert-light" role="alert">
      Please Select A Recipe!
    </div>
  </ng-template>
</div>
