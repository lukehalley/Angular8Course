<div class="container">
  <div class="row">
    <ng-template [ngIf]="onlyOdd">
      <p>Displaying Only Odd Numbers</p>
    </ng-template>
    <div *ngIf="onlyOdd">
      <ul class="list-group">
        <li class="list-group-item" *ngFor="let oNum of oddNumbers">
          {{ oNum }}
        </li>
      </ul>
    </div>
    <ng-template [ngIf]="!onlyOdd">
      <p>Displaying Even and Odd Numbers</p>
    </ng-template>
    <div *ngIf="!onlyOdd">
      <ul class="list-group">
        <li class="list-group-item" *ngFor="let eNum of evenNumbers">
          {{ eNum }}
        </li>
      </ul>
    </div>
    <hr />
    <div class="col-xs-12">
      <button class="btn btn-primary" (click)="onlyOdd = !onlyOdd">
        Only show odd numbers
      </button>
    </div>
  </div>
</div>
